# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_expired_product_views:
    class: CleanupExpiredProductViewsJob
    queue: background
    schedule: every day at 3am
  # Fires at minute 0 of every even hour (00:00, 02:00, ... 22:00), in the
  # app's configured Time.zone - UTC here, since config.time_zone is unset
  # in config/application.rb.
  refresh_product_popularity_stats:
    class: RefreshProductPopularityStatsJob
    queue: background
    schedule: every 2 hours
